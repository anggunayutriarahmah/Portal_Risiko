    <script>
      // Neutralize Vite HMR WebSocket in preview iframe environment where HMR is disabled
      (function () {
        var NativeWebSocket = window.WebSocket;
        if (typeof NativeWebSocket === 'function') {
          var WrappedWebSocket = function (url, protocols) {
            var isViteHmr =
              protocols === 'vite-hmr' ||
              (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1) ||
              (typeof url === 'string' && (url.indexOf(':24678') !== -1 || url.indexOf('token=') !== -1));
            if (isViteHmr) {
              var dummy = new EventTarget();
              dummy.url = String(url || '');
              dummy.protocol = 'vite-hmr';
              dummy.readyState = 1;
              dummy.bufferedAmount = 0;
              dummy.extensions = '';
              dummy.binaryType = 'blob';
              dummy.send = function () {};
              dummy.close = function () { dummy.readyState = 3; };
              dummy.onopen = null;
              dummy.onmessage = null;
              dummy.onerror = null;
              dummy.onclose = null;
              setTimeout(function () {
                var evt = new Event('open');
                dummy.dispatchEvent(evt);
                if (typeof dummy.onopen === 'function') dummy.onopen(evt);
              }, 0);
              return dummy;
            }
            return arguments.length > 1
              ? new NativeWebSocket(url, protocols)
              : new NativeWebSocket(url);
          };
          WrappedWebSocket.prototype = NativeWebSocket.prototype;
          WrappedWebSocket.CONNECTING = NativeWebSocket.CONNECTING;
          WrappedWebSocket.OPEN = NativeWebSocket.OPEN;
          WrappedWebSocket.CLOSING = NativeWebSocket.CLOSING;
          WrappedWebSocket.CLOSED = NativeWebSocket.CLOSED;
          window.WebSocket = WrappedWebSocket;
        }
      })();
    </script>
